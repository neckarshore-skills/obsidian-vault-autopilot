name: secrets-gate

# The estate's secrets gate on every pull request to main (neckarshore-ai/neckarshore-planning
# #2928): gitleaks over the pull request's commits with the estate's secret, credential-path
# and personal-data rules. Secrets and credential file names fail the job; personal data is
# reported in the job summary only.
#
# The pin is the same commit dev-environment compares its rules with
# (config/secrets-gate-public.pin there). A bump moves all callers together.
# Runner: hosted Linux unless the repository variable SECRETS_GATE_RUNS_ON says otherwise.
# False positive: `gitleaks:allow` on the line, or the fingerprint in `.gitleaksignore`.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    uses: neckarshore-ai/.github/.github/workflows/secrets-gate.yml@794d1defb4cd4ec3851cf081dcd70e02aa4a93af
